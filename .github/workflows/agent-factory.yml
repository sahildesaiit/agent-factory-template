name: Agent Factory Runner
on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Blueprint
        uses: actions/checkout@v4

      - name: Execute Warp Factory Pipeline
        uses: warpdotdev/factory-action@v1
        with:
          api-key: ${{ secrets.WARP_FACTORY_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          agent-skills-path: './.agents/skills'
