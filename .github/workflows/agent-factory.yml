name: AI Software Factory

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Issue Triage
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Code Blueprint
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Factory Triage
        env:
          FACTORY_STAGE: triage
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.WARP_FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run factory

  implementation:
    name: Code Implementation
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-implement'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Code Blueprint
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Factory Implementation
        env:
          FACTORY_STAGE: implementation
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.WARP_FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run factory

  review:
    name: Pull Request Review
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Code Blueprint
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Factory Review
        env:
          FACTORY_STAGE: review
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.WARP_FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run factory
